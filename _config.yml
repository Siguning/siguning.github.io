# Site configuration. This file is NOT reloaded by `jekyll serve`; restart after editing.

title: Racury Works
tagline: "Game Dev · Engineering · Devlog"
description: >-
  Tech blog where I occasionally post about game development —
  Godot, Unreal, Unity, game design, algorithms and devlogs.
lang: ko
timezone: Asia/Seoul
url: "https://siguning.github.io"
baseurl: "" # CI passes --baseurl from actions/configure-pages

author:
  name: Siguning
  email: siguning@gmail.com
  bio: "게임을 만들고, 만드는 법을 기록합니다."

social:
  github: siguning
  twitter: Siguning01

# Racury theme options (see README.md).
racury:
  skin: hud                        # default skin: hud | valve | backrooms
  skin_switcher: true              # visitors can switch skins from the header (saved in their browser)
  skins: [hud, valve, backrooms]   # skins the switcher offers; only these skins' fonts are loaded
  # generate_pages: false          # don't auto-create /archive/ /categories/ /tags/ /series/ /graph/ /404.html

# Search-console verification (rendered by jekyll-seo-tag).
webmaster_verifications:
  google: 1NV22aSAQUAAGcC5e99w3DPpyJzvm5vVkswxqZWppk8

# Top navigation (url is relative to baseurl).
nav:
  - { title: Posts, url: /archive/ }
  - { title: Categories, url: /categories/ }
  - { title: Tags, url: /tags/ }
  - { title: Series, url: /series/ }
  - { title: Graph, url: /graph/ }
  - { title: About, url: /about/ }

# Optional comments via giscus (https://giscus.app). Leave repo_id empty to disable.
giscus:
  repo: siguning/siguning.github.io
  repo_id: ""
  category: Comments
  category_id: ""
  mapping: pathname

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  math_engine: null # math is rendered client-side by MathJax
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

sass:
  style: compressed
  sourcemap: development

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      toc: true
      comments: true
  - scope: { path: "" }
    values:
      layout: page

exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - lib/
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
