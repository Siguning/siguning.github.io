---
layout: page
plain: true
wide: true
graph: true
---
<div class="graph-view hud">
  <div class="graph-view__controls">
    <label class="switch"><input type="checkbox" data-graph-toggle="category" checked><span></span>Categories</label>
    <label class="switch"><input type="checkbox" data-graph-toggle="tag" checked><span></span>Tags</label>
    <label class="switch"><input type="checkbox" data-graph-toggle="labels" checked><span></span>Labels</label>
    <input class="graph-view__find" type="search" placeholder="노드 찾기…" aria-label="Highlight nodes" data-graph-find>
  </div>
  <div class="graph-view__canvas" data-graph="full"></div>
  <div class="graph-view__legend hud-label">
    <span><i class="lg lg--post"></i>Post</span>
    <span><i class="lg lg--category"></i>Category</span>
    <span><i class="lg lg--tag"></i>Tag</span>
    <span><i class="lg lg--link"></i>Wiki link</span>
  </div>
</div>
