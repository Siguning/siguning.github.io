<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
{% include head.html %}
<body class="layout-{{ page.layout | default: 'default' }}">
  {% include icons.html %}
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__stars bg__stars--1"></div>
    <div class="bg__stars bg__stars--2"></div>
    <div class="bg__stars bg__stars--3"></div>
    <div class="bg__glow"></div>

  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  {% include header.html %}

  <main id="main" class="site-main">

  {% include footer.html %}
  {% include search-modal.html %}

</html>
