---
layout: default
---
<div class="container{% if page.wide %} container--wide{% endif %}">
  <header class="page-head reveal">
    <span class="hud-label">// {{ page.kicker | default: page.title | upcase }}</span>
    <h1 class="page-head__title glitch" data-text="{{ page.title | escape }}">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page-head__sub">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body{% unless page.plain %} prose{% endunless %}">
    {{ content }}
  </div>
</div>
