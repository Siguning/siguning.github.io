<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <span class="hud-label">// END OF TRANSMISSION</span>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }} · {{ site.title }}</p>
    </div>
    <div class="site-footer__links">
      {%- if site.social.github %}
      <a class="icon-btn" href="https://github.com/{{ site.social.github }}" aria-label="GitHub" rel="me noopener" target="_blank"><svg class="icon"><use href="#i-github"/></svg></a>
      {%- endif %}
      {%- if site.social.twitter %}
      <a class="icon-btn" href="https://x.com/{{ site.social.twitter }}" aria-label="X (Twitter)" rel="me noopener" target="_blank"><svg class="icon"><use href="#i-x"/></svg></a>
      {%- endif %}
      <a class="icon-btn" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed"><svg class="icon"><use href="#i-rss"/></svg></a>
    </div>
  </div>
</footer>

<button class="to-top icon-btn" type="button" data-to-top aria-label="Back to top">
  <svg class="icon"><use href="#i-arrow-up"/></svg>
</button>

<div class="lightbox" data-lightbox hidden>
  <button class="icon-btn lightbox__close" type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
  <img alt="">
  <p class="lightbox__caption"></p>
</div>
