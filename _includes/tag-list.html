{%- comment -%} Usage: {% include tag-list.html tags=post.tags %} {%- endcomment -%}
{%- if include.tags and include.tags.size > 0 -%}
<ul class="tag-list">
  {%- for tag in include.tags -%}
  <li><a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | uri_escape }}">#{{ tag }}</a></li>
  {%- endfor -%}
</ul>
{%- endif -%}
